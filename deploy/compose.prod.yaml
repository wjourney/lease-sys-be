name: lease-sys

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE in config/versions.env}
    restart: unless-stopped
    init: true
    shm_size: 512m
    env_file:
      - /srv/lease-sys/config/api.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /srv/lease-sys/data/uploads:/data/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in config/versions.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
