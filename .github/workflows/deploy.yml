name: Build and deploy backend

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm build
      - name: Integration tests with disposable MySQL 5.7
        run: |
          set -euo pipefail
          docker compose -p lease-sys up -d --wait
          pnpm exec playwright install --with-deps --only-shell chromium
          pnpm test
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/wjourney/lease-sys-be:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare release archive
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/lease-release"
          mkdir -p "$release_dir"
          git bundle create "$release_dir/source.bundle" master
          docker pull "ghcr.io/wjourney/lease-sys-be:$GITHUB_SHA"
          docker save -o "$release_dir/image.tar" "ghcr.io/wjourney/lease-sys-be:$GITHUB_SHA"
          tar -C "$release_dir" -cf - source.bundle image.tar | gzip -6 > "$release_dir/release.tar.gz"
          du -h "$release_dir/release.tar.gz"
      - name: Upload release archive
        timeout-minutes: 20
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          release_file="lease-release-$GITHUB_SHA.tar.gz"
          scp -o BatchMode=yes -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$RUNNER_TEMP/lease-release/release.tar.gz" \
            "lease-deploy@47.117.136.208:$release_file"
      - name: Activate release
        timeout-minutes: 10
        run: |
          set -euo pipefail
          release_file="lease-release-$GITHUB_SHA.tar.gz"
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            lease-deploy@47.117.136.208 \
            "sudo /usr/local/sbin/lease-sys-deploy api $GITHUB_SHA < '$release_file'; status=\$?; rm -f '$release_file'; exit \$status"
