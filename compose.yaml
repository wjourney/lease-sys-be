services:
  mysql:
    image: mysql:5.7.38
    environment:
      MYSQL_ROOT_PASSWORD: lease_test_root_local_only
      MYSQL_DATABASE: lease_test
    ports:
      - "127.0.0.1:53306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -please_test_root_local_only --silent
      interval: 5s
      timeout: 5s
      retries: 20
